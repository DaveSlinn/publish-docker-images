name: Get Image Magick Image to GHCR

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  sync-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Docker Image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/imagemagick
          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=latest
          
          echo "Copying dpokidov/imagemagick:latest to $IMAGE_ID:$VERSION"
          
          skopeo copy --all \
            docker://docker.io/dpokidov/imagemagick:latest \
            docker://$IMAGE_ID:$VERSION
