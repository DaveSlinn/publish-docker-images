name: Get Structurizr Image to GHCR

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  sync-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Pull Docker Image from Docker Hub
        run: docker pull structurizr/structurizr:preview

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker Image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/structurizr
          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=preview
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag structurizr/structurizr:preview $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
